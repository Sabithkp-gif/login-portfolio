<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="sabith, web developer, login, mailampadam, portfolio, firebase, authentication, google sign-in">
    <meta name="theme-color" content="#090d1b">
    <title>Welcome back</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <main class="login-card">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <h1>Welcome back</h1>
      <p class="intro">Sign in to continue to your portfolio.</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
        </div>
        <button id="submit-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <div class="divider" aria-hidden="true"><span>or continue with</span></div>
      <button id="google-button" class="google-button" type="button">
        <svg aria-hidden="true" viewBox="0 0 48 48" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.71 7.18l7.2 5.59c4.2-3.88 6.55-9.61 6.55-17.24z"/>
          <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.75-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.79l-7.2-5.59c-2 1.35-4.56 2.15-8.71 2.15-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </main>

    <script src="script.js" type="module"></script>
  </body>
</html>
